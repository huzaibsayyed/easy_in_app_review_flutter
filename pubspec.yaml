name: easy_in_app_review_flutter
description: A simple and flexible Flutter package to integrate in-app reviews with minimal setup.
version: 0.0.1
homepage: https://github.com/huzaibsayyed/easy_in_app_review_flutter
repository: https://github.com/huzaibsayyed/easy_in_app_review_flutter
issue_tracker: https://github.com/huzaibsayyed/easy_in_app_review_flutter/issues
platforms:
  android:
  ios:
topics:
  - in-app-review
  - app-review
  - appstore-review
  - playstore-review

environment:
  sdk: ^3.13.1
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter
  in_app_review: ^2.0.12
  shared_preferences: ^2.5.5
  logging: ^1.3.0
  connectivity_plus: ^7.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
